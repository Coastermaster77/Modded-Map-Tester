[physics]
; Deep Dip Tower (custom arena only)

; ---- Deep Dip gravity: zones come from DeepDipZones.txt (next to this file). Each floor's own gravity starts
; deepdip_zone_delay seconds after you let go of something; the tower-wide pull waits deepdip_delay seconds.
; Gravity wells pull at once. No thrusters above floor 3, no backpack boost. Walls and grey blocks cannot be
; held (no-grab zones); red blocks stun you (stun zones).
deepdip=1
deepdip_delay=7
; a floor's own gravity starts this many seconds after you let go
deepdip_zone_delay=1.0
; 0 = the brake does nothing (push off and you cannot slow down until you grab something)
deepdip_brake=0
; fastest fall speed (m/s)
deepdip_fall_cap=40
deepdip_instant_priority=2
; push-off and thruster strength in the tower (1.0 = normal)
deepdip_push_mult=1.0
deepdip_thrust_mult=1.0

; ---- off (kept here so they stay off)
dodgeball=0
head_bounce=0
contact_bounce=0
push_mult=1.0
thrust_mult=1.0
boost_max_speed=0
boost_while_holding=0
throw_speed=1.0
server_throw_mult=1.0
server_take_disc=0
divider_players=0
divider_disc_pass=0
