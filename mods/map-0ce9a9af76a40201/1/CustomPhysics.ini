[physics]
; MAIN game (2026-10-03): head bounce, contact bounce, backpack boost top speed 15, the
; bludgers, the launched disc (Quidditch balls) and the second spawn set / 7 per team (v10), ONLY on the levels below. The normal arena must never be listed.
allowed_levels=0xF229B70AC9F62369,0x9B81A0EF8465E386
; head bump: share of the into-surface speed kept. 1.0 = no speed lost, 0 = off
head_bounce=0
head_bounce_full_range=1
; any body hit: share of lost speed given back. 1.0 = full bounce, 0 = off
contact_bounce=0
contact_min_speed_lost=0.5
contact_min_speed=1.0
contact_cooldown=0.3
contact_tolerance=0.2
push_mult=2.0
thrust_mult=1.0
; backpack boost top speed in m/s on the allowed levels (stock 5; 0 = stock). Its push scales up with it
boost_max_speed=15
throw_speed=1.0
server_throw_mult=1.0
server_take_disc=0
; ---- bludgers (v9): these discs hunt the other team's heads after a throw and stun on a head hit
bludger=0
; disc slots that are bludgers (slot order = CR15FrisbeeCR order): 0 = match disc, 1 = the spare,
; 2/3/4 = Disc 2/3/4 from "Quidditch Balls.bat". Add ,1 to make the spare one too.
bludger_slots=2,3
; how hard it turns toward the target head (higher = sharper), and its speed while hunting (m/s)
bludger_turn=5.0
bludger_min_speed=9.0
bludger_max_speed=18.0
; after a throw it hunts the OTHER team's nearest head for this long (= the game's possesion_time,
; i.e. while it still shows the thrower's team colour); if it has not hit anyone by then it goes for
; the nearest player of ANY team, and keeps hunting until it hits someone
bludger_hunt_seconds=5.0
; 1 = nobody can grab a bludger while it is team-coloured (those seconds); 0 = grabbable as usual
bludger_no_grab=1
; after a hit it bounces away from the head at this share of the throw speed
bludger_bounce=0.5
; 1 = in the any-team phase (after the team-colour time, white disc) it may also go for the player who threw it
bludger_hit_thrower=1
bludger_stun_seconds=2.5
; how close (m) to the centre of the head counts as a hit
bludger_head_radius=0.40
bludger_stun_cooldown=2.0
; who sends the stun: authority (match host/server) or all (every modded game that sees the hit sends it; needed when you HOST, 2026-10-04)
bludger_stun_on=all
; ---- launch (v7): this disc slot is sent flying when the level comes up (Disc 4 = slot 4, which
; "Quidditch Balls.bat" also gives a no-slow-down bounce). -1 = off
launch_slot=-1
; speed in m/s, random direction, this many seconds after the level loads
launch_speed=20
launch_delay=2.0
; who launches it: authority (match host/server, default) or all (every process, for testing alone)
launch_on=authority
; ---- players per team (v10, SERVER side): stock 5. The lobby must have room for 2 x this many
max_per_team=0
; ---- second spawn set (v11, each player's own game). Spawn ids 300+slot (team A) / 400+slot
; (team B) are the second spawn points (spawn_points.txt). When the match begins (no goal counted
; yet) the slots in respawn_start_slots are put there; after respawn_alt_after_goals goals the slots
; in respawn_alt_slots are put at id + respawn_alt_offset (0 = the same second points); other slots
; (5 = goalie, 6 = seeker) go back to the spawn they entered the match at. Entering the match is
; never changed. respawn_alt=0 turns all of this off.
respawn_alt=0
respawn_start=1
respawn_start_slots=0,1,2,3,4,5,6
respawn_alt_slots=0,1,2,3,4
respawn_alt_offset=0
respawn_alt_after_goals=1
respawn_alt_band=3
; ---- role buttons (v16, each player's own game): GOALIE / SEEKER / BEATER / CHASER on the right-hand
; terminal in each tower spawn room (role_buttons.py v2, run by Quidditch Balls.bat). Press one = your
; role for the match. Goalie/Seeker get the second spawn only at match start; Beater/Chaser (and no
; role) also after goals. 0 = off (Echo Mods.bat option 11).
role_buttons=0
; 1 = the old disc buttons (v12, disc slots below) instead; 0 = the terminal buttons (v16)
role_discs=0
; after a role pick, make the scoreboard redraw your name: 1 = "entrant data changed" event,
; 2 = "team changed" event (what a team switch sends), 0 = off
role_board_refresh=1
; role button colours (v16e): BEATER green, SEEKER gold = the disc colours (disc_colors slot 2 / slot 4)
; unless role_color_beater / role_color_seeker = r,g,b are set. 0 = stock look (Echo Mods.bat option 12)
role_button_colors=0
role_color_beater=
role_color_seeker=
; GOALIE pink (= the main disc, disc_colors slot 0) and CHASER red (v16h). Empty = these defaults.
role_color_goalie=1,0.4,0.75
role_color_chaser=1,0.25,0.25
role_goalie=5,9
role_seeker=6,10
role_beater=7,11
role_chaser=8,12
; how many of each per team (shown for now; enforced once picks are shared between players)
role_limit_goalie=1
role_limit_seeker=1
role_limit_beater=2
role_limit_chaser=3
; the buttons spring back to their spot: spring strength, top speed (m/s), and how close (m)
; your head must be to a held button for the grab to count as yours
role_button_spring=6
role_button_max_speed=6
role_button_reach=1.5
; 1 = while you have a role, your name on the boards reads "Name - Role" (your own screen only for now)
role_name_tag=1
; ---- who may grab what (v16g, each player's own game): "disc slot:roles;..." -- the grab bubble of a
; disc your role may not take is removed on your game. Slots: 0 = the match disc (quaffle), 2/3 =
; the bludgers, 4 = Disc 4 (the snitch). Roles: goalie, seeker, beater, chaser, all. Leave empty = off.
role_grab=
; a player with no role yet: 0 = can grab none of the discs listed above, 1 = anything
role_grab_none=0
; the grab bubble a disc keeps while you may not grab it (0 would remove it and the game then grabs on touch)
role_grab_range=0.001
; ---- disc glow colours (v15, each player's own game): the grey/white glow the level script gives a
; disc with no team becomes the disc's own colour. "disc slot:r,g,b" pairs separated by ;
; (slot order = CR15FrisbeeCR: 2/3 = Disc 2/3, 4 = Disc 4, 5-12 = the role buttons). Team colours
; while a disc is thrown are left alone. Remove a slot to keep it white.
disc_colors=0:1,0.4,0.75;2:0.2,1,0.3;3:0.2,1,0.3;4:0.2,1,0.3;5:0.2,1,0.3;6:0.2,1,0.3;7:0.2,1,0.3;8:0.2,1,0.3;9:0.2,1,0.3;10:1,0.8,0.15;11:0.7,0.3,1;12:0.25,0.9,0.35
; a glow counts as grey/white (and gets replaced) when max(r,g,b) - min(r,g,b) is at most this
disc_colors_grey=0.25
; the halo sphere around a free disc: its glow = the disc colour x this (0 = leave it white)
disc_halo_scale=0.4
; ---- bludger shock (Carry Speed shim, dbgcore_echorelay.dll): the bludger discs (bludger_slots)
; stun ANY player they touch, all the time (head or chest within bludger_shock_radius m),
; for bludger_stun_seconds, then bludger_stun_cooldown s before the same player can be stunned again.
; Sent by the match host/server/offline game (bludger_stun_on=all: every player). 0 = off.
bludger_shock=0
bludger_shock_radius=0.5
; ---- Quidditch scoring (v17): each goal is worth goal_points instead of 2/3, and grabbing the snitch
; (disc slot snitch_slot, Disc 4) gives the grabber's team snitch_points, once per match (again after
; both scores are back to 0). Given by the match host/server/offline game (snitch_points_on=all: every
; game, for testing). 0 = off (Echo Mods.bat option 14).
quidditch_scoring=0
goal_points=10
snitch_points=150
snitch_slot=4
snitch_points_on=authority
; ---- bubbles (v18, each player's own game). FIELD bubble = the inner edge of the pitch-side stone rail
; (ellipse field_bubble_axes x,z in m), from the pitch up to field_bubble_wall m, capped at field_bubble_top m.
; Once inside, everyone but a SEEKER stays in (pushed back at bubble_push m/s); field_bubble_balls (disc slots:
; 0 quaffle, 2/3 bludgers) bounce off it. The snitch (4) and seekers are only stopped by the big lid.
; 0 = off (Echo Mods.bat option 15).
field_bubble=0
field_bubble_axes=30.39,54.99
field_bubble_wall=16
field_bubble_top=20.5
field_bubble_balls=0,2,3
; how much speed the quaffle/bludgers keep off the field bubble: along the wall, into the wall (stock wall 0.5,0.5)
field_bubble_bounce=0.5,0.5
; GOALIE bubble = the goal-area arc's circle (goalie_bubble_radius m, centre on the goal line at game z
; goalie_bubble_z_blue / _orange) across the field: a goalie inside it stays inside; others pass freely.
; 0 = off (Echo Mods.bat option 16).
goalie_bubble=0
goalie_bubble_radius=13.25
goalie_bubble_z_blue=-49.45
goalie_bubble_z_orange=49.45
bubble_margin=0.3
bubble_push=4
; ---- goal banners (v19, each player's own game): the eight wall screens (the scorer's card) and the two
; boards behind the goals that the arena shows after a goal stay visible all the time. A hide from the arena script is
; replaced by the board's last visible colour (or banners_color = r,g,b,a if it was never shown).
; banners_force_color = r,g,b,a would paint the boards that colour whenever the script touches them.
; 0 = stock (Echo Mods.bat option 17). Every board colour change is written to CustomPhysics.log.
banners_always=0
banners_color=1,1,1,1
banners_force_color=
banners_min_alpha=0.05
; ---- banner probe (v21, log only): pressing a role button writes the players' heraldry / equipped-banner
; data to CustomPhysics.log (first 4 presses) -- research for putting your banner on the spawn-room banners.
; Changes nothing in game. 0 = off (Echo Mods.bat option 18).
banner_probe=0
; ---- my banner (v22, your own game, allowed levels only): pressing a role button draws YOUR equipped banner
; (heraldry slot my_banner_slot) on the canvas elements my_banner_prims of the canvas layouts my_banner_canvas
; (2f544c95a8289028 = the 8 wall scorer screens; all = every canvas that has the element). Test step toward the
; spawn-room banners. The first press logs every canvas on the map. 0 = off (Echo Mods.bat option 19).
my_banner=0
my_banner_slot=7
my_banner_prims=pattern_1
my_banner_canvas=2f544c95a8289028
; ---- banner screens hold (v23, your own game, allowed levels only): the 14 spawn-room banner screens share
; one instance-model asset with the 8 wall scorer screens; the arena script rolls them all up at round start.
; 1 = those custom-data writes are dropped, so the screens stay down. 0 = stock (Echo Mods.bat option 20).
banner_screens_hold=0
banner_screens_assets=
; ---- bludger hits (v24, allowed levels only): bludger_retarget=1 -> after hitting a player the bludger goes for
; the next player (not the one it just hit) instead of stopping; 0 = one hit per throw (Echo Mods.bat option 21).
; bludger_hold_max = seconds a hand can hold a bludger before it lets go by itself, so beaters "hit" it
; (the throw speed is the hand speed); 0 = hold as long as you like (Echo Mods.bat option 22).
bludger_retarget=0
bludger_hold_max=0
; ---- 8 disc dodgeball (v25f, allowed levels only): dodgeball=1 -> after a throw a dodgeball homes in on the other
; team while it shows the thrower's team colour (bludger_hunt_seconds), then just bounces around; a head hit stuns either way; cannot be grabbed while team-coloured, anyone
; may grab them; after a head hit they bounce for dodgeball_freeze s, then stay put until grabbed. Same speeds/stun
; settings as the bludger_* keys above. dodgeball_slots is written by Dodgeball Discs.bat. 0 = plain discs
; (Echo Mods.bat option 23).
dodgeball=1
dodgeball_freeze=0.25
dodgeball_slots=2,3,4,5,6,7,8,9
; dodgeball_main_disc=1 -> the match disc gets the same dodgeball physics and does NOT score (switched together with dodgeball by Echo Mods.bat option 23).
dodgeball_main_disc=0
; ---- toy gravity + racquetball bounce (v25i/v25j): free discs fall (toy_gravity_g m/s^2, not while held) and bounce
; back at toy_bounce x the impact speed. Runs on toy_gravity_level (list) WITHOUT allowed_levels: the lobby and the
; racquetball lobby mpl_lobby_racquetball (0x9B81A0EF8465E386). toy_gravity_actors = discs picked by actor hash: the two
; racquetball balls (Racquet Ball R / L, given disc rows by racquetball_props.py). toy_gravity_all=1 = test: every free
; disc except slot 0 (Echo Mods.bat option 26 switches toy_gravity and toy_gravity_all together).
toy_gravity=0
toy_gravity_all=0
toy_gravity_slots=
toy_gravity_actors=BFE4A1E0C526F9CE,A1E4A1E0C526F9CE
toy_gravity_level=D09AFD15B1C75C04,9B81A0EF8465E386
toy_gravity_g=9.8
toy_bounce=0.8
toy_bounce_min_speed=1.0
divider_pass_flags=06000840,00000840,01000840
divider_tunnel=0
boost_while_holding=1
carry_speed_cap=25
divider_players=0
racquetball_speed_cap=0
divider_margin=0.30
divider_axis=2
divider_plane=0
; v26m: each stun of an OTHER-team player gives the thrower's team this many points on the scoreboards (0 = off;
; the match host/server adds them; Echo Mods.bat option 41).
dodgeball_stun_points=1
racquetball_fall_speed=0
racquetball_gravity=0
racquetball_player_gravity=0
racquetball_player_gravity_boost_mult=0.4
racquetball_player_gravity_mult=1.0
; v26f player feet (Echo Mods 37): with player gravity on, the head is kept racquetball_player_height above
; racquetball_floor_y (court floor, game y) so you stand on invisible feet. The log prints "player feet: head y ..." to calibrate floor_y.
racquetball_player_feet=0
racquetball_player_height=1.6
racquetball_floor_y=-0.77
racquetball_feet_lift=4.0
racquetball_feet_lift_max=1.5
platform_log=1
; moving block collision (EchoStreak.dll = RacquetCap v3): the moving block on the Move Test map is solid where it is (Echo Mods 36)
mover_solid=0
mover_steps=2
; v4: 1 = the block's own box collision is MOVED with the block every frame (engine body-pose call) and gets the Combat
; moving platform's body flags + the door filter; 0 = the old copy-swapping. mover_body_flags/cat/mask are hex.
mover_follow=1
mover_follow_bodies=2
mover_body_flags=0
mover_body_cat=0
mover_body_mask=100000
; 1 = move the box the engine way (position delta + pose-changed flag), 2 = also write the world position directly
mover_move_mode=1
; mover_mode: 1 = the mod moves the box bodies (v4d), 2 = engine path (the instance primary becomes the physics node; v4f test)
mover_mode=1
; ---- Deep Dip Tower (v26g, mpl_arena_v2_a = deepdip_level, each player's own game): zones from DeepDipZones.txt
; (next to this ini). After letting go of something you float deepdip_delay seconds, then the tower's gravity
; pulls you down; gravity wells and the priority-2+ spots (vents, needle, hidden heavy spots) pull at once.
; No-thruster floors cut hand thrusters + boost. deepdip_push_mult / deepdip_thrust_mult replace push_mult /
; thrust_mult on that level. 0 = off (Echo Mods.bat option 38).
deepdip=0
deepdip_level=0xF229B70AC9F62369
deepdip_delay=7
deepdip_fall_cap=40
deepdip_instant_priority=2
deepdip_push_mult=1.0
deepdip_thrust_mult=1.0
; v26l: a stage's own gravity (priority 1 zones) starts deepdip_zone_delay seconds after you let go (the tower-wide
; gravity still waits deepdip_delay). deepdip_brake=0 = the brake does nothing on the Deep Dip level (Echo Mods 40).
deepdip_zone_delay=1.0
deepdip_brake=0

; ---- v26n HEATSEEKER (Rocket League mode, Echo Mods 42) -- level mpl_arena_heatseeker only; read at game start.
; Grab the disc -> after heatseeker_hold s it leaves your hand, flies your throw direction at the current speed,
; then curves toward the other team's goal. Speed = start + step per touch (max). Bounce off the end wall around
; its target goal (|z| > backwall_z) -> it targets the other goal and speeds up. Goal/reset -> neutral, start speed.
heatseeker=1
heatseeker_level=0x0E9A621117AF2300
heatseeker_slot=0
heatseeker_hold=0.1
heatseeker_start_speed=8
heatseeker_speed_step=2
heatseeker_max_speed=25
heatseeker_turn=2.5
heatseeker_goal_z=36.05
heatseeker_backwall_z=30
heatseeker_flip_goals=0
