; Racquetball mod (public) -- CustomPhysics.ini for Map Tester 2
; Goes with the locked public dbgcore.dll (v26k-p10). Only works on custom levels (mpl_lobby_racquetball).
; Matches Echo Mods 27 (rackets + balls, in the map), 32 (ball speed cap) and 34 (ball gravity).
[physics]
; --- racquetball ---
racquetball_mod=1
racquetball_gravity=2.25
racquetball_fall_speed=0
racquetball_speed_cap=17
racquetball_player_gravity=0
racquetball_player_feet=0
racket_hit=1
racket_restitution=0.8
racket_cooldown_ms=120
racket_power=1.0
bounce_rings=1
hit_guard=1
; --- everything else off (some of these default to ON when missing) ---
head_bounce=0
contact_bounce=0
server_throw_mult=1.0
server_take_disc=0
score_direct=0
goal_no_reset=0
max_per_team=0
push_mult=1.0
thrust_mult=1.0
boost_while_holding=0
carry_speed_cap=0
dodgeball=0
dodgeball_stun_points=0
divider_players=0
deepdip=0
heatseeker=0
toy_gravity=0
