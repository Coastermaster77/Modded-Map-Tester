; can grab and throw it, and its centre passing through a ring hole scores goal_points for the other team (blue end = z < 0).
; The match disc is parked 100 m under the arena by quidditch_items.py s6. quaffle_rings = x,y,z,radius per ring hole.
; quaffle_follow=1 = the old v28d look-only mode (the ball rides on the match disc; then don't park the disc).
quaffle_toy=1
quaffle_follow=0
quaffle_toy_spawn=0,8,0
quaffle_goal_cooldown=1.5
quaffle_rings=-7.1,7.2,-49.7,2.0;0,12,-49.7,2.0;7.1,8.7,-49.7,2.0;7.1,7.2,49.7,2.0;0,12,49.7,2.0;-7.1,8.7,49.7,2.0
