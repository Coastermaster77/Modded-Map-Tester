player_body_cat=10000805
player_body_mask=00080800
player_body_names=AAE49C0D301DE3EB
; only bodies this close to a live player head are touched (keeps the 18 parked bodies of empty slots out of it)
player_body_radius=0.9
; v26x limbs: 9 box bodies (hips, upper/lower arms to the hands, thighs, shins hanging from the hips) posed every frame; sizes in m
player_body_limbs=1
player_body_limb_w=0.12
player_body_limb_arm=0.30
player_body_limb_thigh=0.45
player_body_limb_shin=0.45
player_body_limb_shoulder=0.20
player_body_limb_hip=0.10
; v26w contact push: a free disc touching the body (hull vertices within push_radius) gets the closing speed x (1 + bounce)
player_body_push=1
player_body_push_radius=0.04
player_body_push_bounce=0.4
player_body_push_min=0.3
player_body_velocity=1

; ---- name colours (v27h): your name in gold on every canvas text (tablets, boards, nameplates if
; they are canvas text) -- only on allowed levels. name_color_all=1 colours every player's name.
; canvas_text_log=1 writes every canvas text (with its primitive and caller) to the log once -- a probe.
name_colors=0
name_color=1,0.75,0.1
name_color_all=0
canvas_text_log=0

; ---- dev gold name (v27k, Echo Mods 46): the game's own developer colour. The entrant cache byte "profile has a dev
; object" is set for you after every refresh, so the scripts colour your name the way they do for RAD devs.
; dev_name_lobby=1 also in the main lobby; dev_name_all=1 marks every player.
dev_name=0
dev_name_lobby=0
dev_name_all=0
snitch_toy_spawn=0,11,0
knock_max_time=10
regrip_reach=0.8
respawn_room_after_start=1
freeze_signal_disc=4
; ---- v28j: summons by the match host (every player gets a broom, every beater a bat). knock_max_time = longest fall (s),
; also ends on landing or grabbing a broom. regrip_reach = your other hand this close to your bat/broom (and gripping)
; lets the first hand go. respawn_room_after_start=1: a reset that is not right after a goal (time out, restart round, match end) puts everyone in the spawn room; goal resets keep the field spawn (respawn_goal_window s).
; freeze_signal_disc = the parked disc the host moves so other players see the freeze (-1 = off).
respawn_goal_window=12
; ---- v28k: after a quaffle goal (host) the quaffle restarts quaffle_goal_reset_front m in front of the goal it went through
; (x 0, y quaffle_goal_reset_y) after quaffle_goal_reset_delay s, and the bludgers go back to bludger_toy_spawns. 0 = off.
quaffle_goal_reset=1
quaffle_goal_reset_bludgers=1
quaffle_goal_reset_delay=1.0
quaffle_goal_reset_front=6
quaffle_goal_reset_y=9
; ---- v28l: BROOM FLIGHT. While you hold a broom the backpack boost is off; the INDEX trigger of the hand holding the broom
; flies you along the broom (handle end first). Your velocity swings toward where the broom points at broom_fly_turn rad/s
; without losing speed (swooping), speeds up to broom_fly_speed x trigger: broom_fly_accel_start m/s^2 below
; broom_fly_start_speed, then broom_fly_accel. Trigger released = coast (broom_fly_drag per second). broom_fly_reverse=1 flips
; the direction if it flies bristles-first. broom_fly=0 = the old boost broom.
broom_fly=1
broom_fly_speed=20
broom_fly_accel=5
broom_fly_accel_start=10
broom_fly_start_speed=6
broom_fly_turn=2.5
broom_fly_drag=0
broom_fly_deadzone=0.1
broom_fly_reverse=0
; v28n: broom_fly_coast_turn = how fast (rad/s) your flight follows the broom when the trigger is released
broom_fly_coast_turn=2.5
; v28o: total speed cap on a broom (seekers have their own), and how long after a knocked-off player lands their broom comes back
broom_fly_cap=9
broom_fly_cap_seeker=14
broom_return_delay=2
; v28p: a held bat / broom has no collision (goals, floor, walls cannot push it out of your hand); dropped, it collides again. 0 = off
held_no_collision=1
; v28p: three grip presses within triple_grip_window s drop the bat / broom in that hand
triple_grip_drop=1
triple_grip_window=1.2
; v28q: brake strength x brake_mult. held_near = metres from a head where the host counts a bat / broom moving with that player as held
brake_mult=2
held_near=1.0
; v28s: after FREEZE / FREEZE ALL, pressing NORMAL gives every object back the speed it had when it was frozen. 0 = they stay still
freeze_resume_speed=0
; v28u: bats / brooms only fly to their players while a round is being played (not before the start, not after the end)
summon_only_in_round=1
summon_round_grace=15
; v28w: bats / brooms are solid everywhere except at the goals: within goal_nocollide_ring m of a ring centre (and
; goal_nocollide_depth m of its plane) or inside a post column (goal_nocollide_post m, from height goal_nocollide_low up)
goal_nocollide_ring=3.2
goal_nocollide_depth=1.2
goal_nocollide_post=1.0
goal_nocollide_low=-1.0
; v28z: colour of the HUD disc tracking icon (the POI marker that fades when you look at it). r,g,b 0-1 or 0-255.
; Remove the line to keep the game's white icon. disc_icon_log=1 lists every UI canvas once per level.
disc_icon_color=1,0.75,0.1
; v29a: log where the disc marker and its target are, once a second for 60 s
disc_icon_diag=0
; v29b: the disc marker points at the quaffle instead of the parked disc
poi_quaffle=0
; v29d: the ball markers (Quidditch Markers.bat) follow the quaffle / bludger bodies every frame
marker_follow=1
; v29e: who sees which ball marker (role names goalie, seeker, beater, chaser, norole, all)
marker_roles=1
marker_roles_quaffle=goalie,beater,chaser,norole
marker_roles_bludger=goalie,beater,chaser,norole
marker_roles_snitch=seeker
