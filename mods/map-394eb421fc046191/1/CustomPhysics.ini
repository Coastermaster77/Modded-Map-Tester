; Racquetball mod (public) -- CustomPhysics.ini for Map Tester 2
; Goes with the locked public dbgcore.dll (v26k-p16c). Only works on custom levels (mpl_lobby_racquetball).
; Map: Lobby - racquetball v7.blend (clear glass with frames, scoreboards) -> Echo Mods 27 (rackets + balls) -> rings ->
; Echo Mods 45 (team tokens, team colours, team buttons, scoreboard digits + RESET buttons).
[physics]
; --- racquetball ---
racquetball_mod=1
racquetball_gravity=2.25
racquetball_fall_speed=0
racquetball_speed_cap=10
racquetball_player_gravity=0
racquetball_player_feet=0
racket_hit=1
racket_restitution=0.8
racket_cooldown_ms=120
racket_power=1.0
bounce_rings=1
hit_guard=1
; --- p14: racquetball v4 ---
; the racket hit is checked only by the game of the player holding the racket; that game takes the ball (ping fix)
racket_hit_owner_only=1
; teams: buttons in the hallway (court R Blue / Orange, court L Green / Pink), 2 per team; names, rackets and rings coloured
racquetball_teams=1
racquetball_team_buttons=1
racquetball_team_colors=1
team_color_blue=0.10,0.35,1.00
team_color_orange=1.00,0.45,0.05
team_color_green=0.45,1.00,0.10
team_color_pink=1.00,0.15,0.60
; respawns: rackets go back to the rack after this long without being held (0 = never)
racket_respawn_seconds=30
; the ball goes back to its spot when it is (nearly) stopped for ball_halt_seconds, or when the same team's ring shows
; up on the front wall twice in a row (ball_front_wall_rule)
ball_halt_speed=0.3
ball_halt_seconds=2
ball_front_wall_rule=1
; a hand that went through a wall / the floor (up to wall_grab_depth m) grabs the surface when you squeeze grip
wall_grab_through=1
wall_grab_depth=0.6
; a racket grabbed anywhere ends up held by the handle the way you last held a handle with that hand
; (racket_grip_0 / racket_grip_1 are written by the mod when you grab a handle)
racket_grip_snap=1
racket_grip_y=-0.06
; --- p16: scoreboards (normal racquetball scoring, first to score_to; RESET button on the court side) ---
racquetball_scoreboard=1
score_to=15
; hand slaps and throws count as hits too (wall ball); 0 = only rackets count
score_hands=1
; --- everything else off (some of these default to ON when missing) ---
head_bounce=0
contact_bounce=0
server_throw_mult=1.0
server_take_disc=0
score_direct=0
goal_no_reset=0
max_per_team=0
push_mult=1.0
thrust_mult=1.0
boost_while_holding=0
carry_speed_cap=0
dodgeball=0
dodgeball_stun_points=0
divider_players=0
deepdip=0
heatseeker=0
toy_gravity=0
