[physics]
; Dodgeball (custom arena only)

; ---- dodgeball: after a throw a dodgeball homes in on the other team while it shows the thrower's
; team colour, then just bounces around. A head hit stuns. They can't be grabbed while team-coloured.
; After a hit a disc bounces for dodgeball_freeze s, then stays put until someone grabs it.
dodgeball=1
dodgeball_slots=2,3,4,5,6,7,8,9
; 1 = the main disc plays dodgeball too and does not score; 0 = it stays a normal disc
dodgeball_main_disc=0
dodgeball_freeze=0.25
; homing: how hard it turns toward the target head (higher = sharper) and its speed while homing (m/s)
dodgeball_turn=5.0
dodgeball_min_speed=9.0
dodgeball_max_speed=18.0
; how long (s) after a throw it goes only for the other team; after that it may go for anyone
dodgeball_hunt_seconds=5.0
; 1 = nobody can grab a dodgeball while it is team-coloured
dodgeball_no_grab=1
; after a hit it bounces away at this share of the throw speed
dodgeball_bounce=0.5
; 1 = after the team-colour time it may also go for the player who threw it
dodgeball_hit_thrower=1
; stun on a head hit: length (s), how close to the head counts (m), and the wait before the same player can be stunned again (s)
dodgeball_stun_seconds=2.5
dodgeball_head_radius=0.40
dodgeball_stun_cooldown=2.0
; who sends the stun: all = every modded player (needed when a player hosts), authority = the match host/server only
dodgeball_stun_on=all
; each stun of an other-team player = this many points for the thrower's team on the scoreboards (0 = off)
dodgeball_stun_points=1

; ---- disc glow colours: main disc pink, dodgeballs green (disc slot:r,g,b)
disc_colors=0:1,0.4,0.75;2:0.2,1,0.3;3:0.2,1,0.3;4:0.2,1,0.3;5:0.2,1,0.3;6:0.2,1,0.3;7:0.2,1,0.3;8:0.2,1,0.3;9:0.2,1,0.3
disc_colors_grey=0.25
disc_halo_scale=0.4

; ---- movement
; push-off speed x2
push_mult=2.0
; hand thrusters (1.0 = normal)
thrust_mult=1.0
; backpack boost top speed in m/s (0 = normal)
boost_max_speed=15
; 1 = the backpack boost works while your hands hold only discs
boost_while_holding=1

; ---- off (kept here so they stay off)
head_bounce=0
contact_bounce=0
throw_speed=1.0
server_throw_mult=1.0
server_take_disc=0
divider_players=0
divider_disc_pass=0
deepdip=0
