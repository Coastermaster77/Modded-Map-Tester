; Racquetball mod (public) -- CustomPhysics.ini for Map Tester 2
; Goes with the locked public dbgcore.dll (v26k-p17). Only works on custom levels (mpl_lobby_racquetball).
; Map: Lobby sport.blend (racquetball + volleyball + tennis rooms) -> Echo Mods 27 (rackets + balls) -> rings ->
; Echo Mods 45 (team tokens, team colours, team buttons, scoreboard digits + RESET buttons).
[physics]
; --- racquetball ---
racquetball_mod=1
racquetball_gravity=0
racquetball_fall_speed=0
racquetball_speed_cap=0
racquetball_player_gravity=0
racquetball_player_feet=0
racket_hit=1
racket_restitution=0.8
racket_cooldown_ms=120
racket_power=1.0
bounce_rings=1
hit_guard=1
; --- p14: racquetball v4 ---
; the racket hit is checked only by the game of the player holding the racket; that game takes the ball (ping fix)
racket_hit_owner_only=1
; teams: buttons in the hallway (court R Blue / Orange, court L Green / Pink), 2 per team; names, rackets and rings coloured
racquetball_teams=1
racquetball_team_buttons=1
racquetball_team_colors=1
team_color_blue=0.10,0.35,1.00
team_color_orange=1.00,0.45,0.05
team_color_green=0.45,1.00,0.10
team_color_pink=1.00,0.15,0.60
; respawns: rackets go back to the rack after this long without being held (0 = never)
racket_respawn_seconds=30
; the ball goes back to its spot when it is (nearly) stopped for ball_halt_seconds, or when the same team's ring shows
; up on the front wall twice in a row (ball_front_wall_rule)
; the ball goes back to its spot after this long with no play at all (no grab, hit or bounce); 0 = never
ball_respawn_seconds=30
ball_halt_speed=0.3
ball_halt_seconds=2
ball_front_wall_rule=1
; a hand that went through a wall / the floor (up to wall_grab_depth m) grabs the surface when you squeeze grip
wall_grab_through=1
wall_grab_depth=0.6
; a racket grabbed anywhere ends up held by the handle the way you last held a handle with that hand
; (racket_grip_0 / racket_grip_1 are written by the mod when you grab a handle)
racket_grip_snap=1
racket_grip_y=-0.06
; --- p16: scoreboards (normal racquetball scoring, first to score_to; RESET button on the court side) ---
racquetball_scoreboard=1
score_to=15
; hand slaps and throws count as hits too (wall ball); 0 = only rackets count
score_hands=1
; --- p17: volleyball + tennis rooms (same teams / buttons / scoreboards as racquetball) ---
; volleyball: rally scoring to volleyball_score_to, win by volleyball_win_by; tennis: games to tennis_games, win by 2
volleyball_score_to=25
volleyball_win_by=2
tennis_games=6
; ball gravity per room (m/s^2; leave out = racquetball_gravity) and speed caps (m/s, 0 = none)
volleyball_gravity=2.25
tennis_gravity=2.25
volleyball_speed_cap=0
tennis_speed_cap=0
; team colours of the new teams (r,g,b 0..1)
team_color_red=1.00,0.08,0.08
team_color_yellow=1.00,0.88,0.05
team_color_purple=0.55,0.15,1.00
team_color_cyan=0.05,0.90,1.00
team_color_maroon=0.55,0.03,0.15
team_color_teal=0.00,0.55,0.50
team_color_navy=0.08,0.12,0.50
team_color_silver=0.70,0.72,0.78
; --- everything else off (some of these default to ON when missing) ---
head_bounce=0
contact_bounce=0
server_throw_mult=1.0
server_take_disc=0
score_direct=0
goal_no_reset=0
max_per_team=0
push_mult=2.0
thrust_mult=2.0
boost_while_holding=0
carry_speed_cap=0
dodgeball=0
dodgeball_stun_points=0
divider_players=0
deepdip=0
heatseeker=0
toy_gravity=0
boost_max_speed=15
bludger=0
launch_slot=-1
respawn_alt=0
bludger_shock=0
role_buttons=0
role_button_colors=0
dev_name=0
role_grab=
quidditch_scoring=0
field_bubble=0
goalie_bubble=0
banners_always=0
my_banner=0
banner_screens_hold=0
bludger_retarget=0
bludger_hold_max=0
dodgeball_main_disc=0
toy_gravity_all=0
mover_solid=0

; ---- arm tablet probe (v27q-v27s): every tablet / canvas button press is logged; tablet_dump=1 dumps the pressed canvas once
canvas_text_log=1
tablet_log=0
tablet_dump=0

; ---- arm tablet team buttons (public p18, Echo Mods 48): Tablet Tab.bat adds the TEAMS tab + 4 team buttons to the tablet,
; then Repack. A press joins / leaves that team (same as the terminal team buttons).
tablet_buttons=0
; tablet_probe=1: log every canvas instance (parents, resource, element names) once -- research for the TEAMS page (p19)
tablet_probe=0

; ---- Grab Objects (public p23): the disc bounces off the grab objects (grab_objects.py) at their live pose, floating,
; held or frozen -- off the object's real convex hull (its physics particles), like a wall: the part of the speed into the
; face is kept x grab_bounce_normal (flipped), the rest x grab_bounce_tangent. A disc already moving away is left alone.
; disc radius in m; bodies with fewer than grab_min_particles particles or smaller than grab_min_half (half size, m) are
; ignored (the lobby ball, the disc). Log: "grab bounce ready", "grab bounce: body ... grab object (N face planes)",
; "grab bounce: disc S off grab object ...".
grab_disc_bounce=1
grab_bounce_normal=0.85
grab_bounce_tangent=0.98
grab_disc_radius=0.15
grab_min_half=0.3
grab_min_particles=8

; ---- FREEZE buttons on the tablet's DEBUG page (Tablet Tab.bat + Tablet Freeze.bat data; public p21+). p23: a DISC is never
; frozen. freeze_mode is written by the buttons (0 normal / 1 freeze / 2 unfreeze / 3 freeze all) and polled by every process.
freeze_buttons=0
freeze_grab_block=1
freeze_drop_states=1
freeze_mode=0
