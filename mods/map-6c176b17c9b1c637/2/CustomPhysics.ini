[physics]
; Heatseeker (custom arena only) - Rocket League's Heatseeker mode for Echo VR

; ---- heatseeker: grab the disc and it pops out of your hand after heatseeker_hold seconds, flies the way you
; threw it, then curves toward the OTHER team's goal at a constant speed. Every grab makes it faster.
; It bounces off walls at full speed and keeps homing. If it bounces off the end wall around the goal it was
; going for, it switches to the other goal and speeds up. After a goal it is neutral again at the start speed.
heatseeker=1
; disc slot (0 = the match disc)
heatseeker_slot=0
; seconds you can hold it before it leaves your hand
heatseeker_hold=0.1
; speed (m/s): first touch, added per touch, top speed
heatseeker_start_speed=8
heatseeker_speed_step=2
heatseeker_max_speed=25
; how hard it curves toward the goal (higher = sharper)
heatseeker_turn=2.5
; goal distance from the centre (m) and how far out a bounce counts as the back wall (m)
heatseeker_goal_z=36.05
heatseeker_backwall_z=30
; 1 = swap which goal each team's disc goes for (if it flies at your own goal)
heatseeker_flip_goals=0
; walls that always send the disc to the far goal when it bounces off them (HeatseekerWalls.txt next to this ini,
; 0 = off), how close the bounce must be (m) and how sharp a turn counts as a bounce (degrees)
heatseeker_walls=HeatseekerWalls.txt
heatseeker_wall_dist=1.0
heatseeker_wall_angle=16

; ---- off (kept here so they stay off)
dodgeball=0
deepdip=0
head_bounce=0
contact_bounce=0
push_mult=1.0
thrust_mult=1.0
boost_max_speed=0
boost_while_holding=0
throw_speed=1.0
server_throw_mult=1.0
server_take_disc=0
divider_players=0
divider_disc_pass=0
